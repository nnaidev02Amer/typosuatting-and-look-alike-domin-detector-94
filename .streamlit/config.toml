[server]
# Bind to loopback only: the dashboard can launch scans, so it must not be reachable from the LAN.
address = "127.0.0.1"
port = 8501
headless = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#111a2e"
textColor = "#e2e8f0"
font = "sans serif"
